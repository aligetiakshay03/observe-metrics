name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: observe_metrics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/observe_metrics_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      ENCRYPTION_KEY: 1111111111111111111111111111111111111111111111111111111111111111
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database schema
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Pushes to main deploy to staging after CI passes.
  deploy-staging:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Configure the two secrets (VERCEL_TOKEN, VERCEL_ORG_ID / VERCEL_PROJECT_ID
      # as VERCEL_ORG_ID / VERCEL_PROJECT_ID) in the repository settings, or
      # replace this job with a `git push` to your Railway/Render/Fly deploy hook.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Vercel (staging)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npx vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
